<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibecoding · Mes projets</title>
<meta name="description" content="Tous mes projets vibecodés avec Claude, jouables en ligne.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<style>
  :root {
    --bg: #0b0a14;
    --bg2: #15122a;
    --card: #1a1730;
    --card-hi: #221e3d;
    --line: #2f2a52;
    --text: #efeaff;
    --muted: #a39cc4;
    --pink: #ff3fa4;
    --cyan: #28e0ff;
    --lime: #b6ff3b;
    --amber: #ffc53d;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Outfit", system-ui, sans-serif;
    overflow-x: hidden;
  }
  /* fond : grille rétro + halos */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 40vw at 15% 0%, rgba(255,63,164,.18), transparent 60%),
      radial-gradient(50vw 40vw at 90% 10%, rgba(40,224,255,.16), transparent 60%),
      linear-gradient(var(--bg), var(--bg2));
  }
  .bg::after {
    content: ""; position: absolute; left: -50%; right: -50%; bottom: 0; height: 55vh;
    background-image:
      linear-gradient(rgba(255,63,164,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40,224,255,.25) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(400px) rotateX(62deg);
    transform-origin: bottom;
    mask-image: linear-gradient(to top, #000 10%, transparent 90%);
    animation: grid 6s linear infinite;
  }
  @keyframes grid { to { background-position: 0 60px, 0 0; } }

  header {
    max-width: 1200px; margin: 0 auto; padding: 72px 20px 28px; text-align: center;
  }
  .kicker {
    display: inline-block; font-family: "Press Start 2P", monospace; font-size: 11px;
    letter-spacing: 2px; color: var(--lime); padding: 8px 14px;
    border: 1px solid rgba(182,255,59,.4); border-radius: 999px; background: rgba(182,255,59,.06);
  }
  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(28px, 6vw, 64px);
    line-height: 1.25; margin: 26px 0 18px;
    background: linear-gradient(90deg, var(--pink), var(--amber), var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,63,164,.35));
  }
  .sub { color: var(--muted); font-size: clamp(16px, 2.2vw, 20px); max-width: 640px; margin: 0 auto; }
  .stats { display: flex; justify-content: center; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
  .stat b { display: block; font-family: "Press Start 2P", monospace; font-size: 22px; color: var(--cyan); }
  .stat span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }

  .filters {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    max-width: 1200px; margin: 18px auto 34px; padding: 0 16px;
  }
  .chip {
    font: 600 14px "Outfit", sans-serif; color: var(--muted); cursor: pointer;
    padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(26,23,48,.7); transition: .2s;
  }
  .chip:hover { color: var(--text); border-color: var(--pink); }
  .chip[aria-pressed="true"] {
    color: #120f22; background: var(--pink); border-color: var(--pink);
    box-shadow: 0 0 18px rgba(255,63,164,.5);
  }

  main {
    max-width: 1200px; margin: 0 auto; padding: 0 16px 80px;
    display: grid; gap: 26px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  @media (max-width: 380px) { main { grid-template-columns: 1fr; } }

  .card {
    --accent: var(--pink);
    position: relative; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    transition: transform .25s, box-shadow .25s, border-color .25s;
    animation: pop .5s both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(18px); } }
  .card:hover, .card:focus-within {
    transform: translateY(-6px);
    border-color: var(--accent);
    box-shadow: 0 14px 40px -12px var(--accent);
  }
  .card.hidden { display: none; }
  .shot {
    position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; background: #000;
  }
  .shot img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .5s, filter .3s; filter: saturate(.9);
  }
  .card:hover .shot img { transform: scale(1.06); filter: saturate(1.15); }
  .shot::after {
    content: "▶ JOUER"; position: absolute; inset: 0; display: grid; place-items: center;
    font-family: "Press Start 2P", monospace; font-size: 16px; color: #fff;
    background: rgba(11,10,20,.55); opacity: 0; transition: opacity .25s;
    text-shadow: 0 0 12px var(--accent);
  }
  .card[data-kind="outil"] .shot::after { content: "▶ OUVRIR"; }
  .card:hover .shot::after { opacity: 1; }
  .emoji {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    font-size: 26px; width: 48px; height: 48px; display: grid; place-items: center;
    background: rgba(11,10,20,.75); border: 1px solid var(--accent); border-radius: 12px;
    backdrop-filter: blur(4px);
  }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    padding: 4px 9px; border-radius: 6px; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .card h2 { margin: 2px 0 0; font-size: 22px; font-weight: 800; }
  .card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  .keys { font-size: 13px; color: var(--muted); }
  kbd {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--text);
    padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px;
    background: var(--card-hi);
  }
  .actions { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; }
  .btn {
    flex: 1; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px;
    padding: 11px 14px; border-radius: 10px; transition: .2s;
  }
  .btn.play { background: var(--accent); color: #120f22; }
  .btn.play:hover { filter: brightness(1.15); box-shadow: 0 0 20px var(--accent); }
  .btn.code { flex: 0 0 auto; color: var(--text); border: 1px solid var(--line); }
  .btn.code:hover { border-color: var(--accent); color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  footer {
    text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 40px;
  }
  footer a { color: var(--cyan); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <span class="kicker">★ INSERT COIN ★</span>
  <h1>Vibecoding</h1>
  <p class="sub">Tous mes projets créés avec Claude, jouables directement dans le navigateur. Choisis ta partie&nbsp;!</p>
  <div class="stats">
    <div class="stat"><b id="nb-projets">0</b><span>projets</span></div>
    <div class="stat"><b id="nb-jeux">0</b><span>jeux</span></div>
    <div class="stat"><b>0 €</b><span>installation</span></div>
  </div>
</header>

<nav class="filters" aria-label="Filtrer les projets">
  <button class="chip" data-filter="tous" aria-pressed="true">Tous</button>
  <button class="chip" data-filter="jeu" aria-pressed="false">🎮 Jeux</button>
  <button class="chip" data-filter="2j" aria-pressed="false">👥 2 joueurs</button>
  <button class="chip" data-filter="outil" aria-pressed="false">🧱 Créations</button>
</nav>

<main id="grid"></main>

<footer>
  Fait avec ❤️ et <a href="https://claude.com/claude-code">Claude Code</a> ·
  <a href="https://github.com/V20100T">github.com/V20100T</a>
</footer>

<script>
// Ajouter un projet = ajouter une entrée ici (+ une capture dans img/)
const PROJETS = [
  {
    repo: "pong-neon", titre: "Pong Néon", emoji: "🏓", kind: "jeu", deuxJoueurs: true,
    couleur: "#28e0ff", tags: ["Arcade", "2 joueurs", "Même clavier"],
    desc: "Le Pong rétro version néon : cadeaux, missiles, boucliers et multi-balle.",
    touches: "<kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> vs <kbd>4</kbd><kbd>8</kbd><kbd>6</kbd>"
  },
  {
    repo: "MoustiKO", titre: "MoustiKO", emoji: "🦟", kind: "jeu", deuxJoueurs: true,
    couleur: "#ff4d5e", tags: ["Duel", "2 joueurs", "Clavier + souris"],
    desc: "Le moustique tigre (clavier) contre l'humain (souris) : piquer, pondre… ou CLAP !",
    touches: "<kbd>←↑→↓</kbd> <kbd>Espace</kbd> vs 🖱️ clic"
  },
  {
    repo: "jardin-des-trolls", titre: "Le Jardin des Trolls", emoji: "🧌", kind: "jeu", deuxJoueurs: true,
    couleur: "#b6ff3b", tags: ["Défense", "1-2 joueurs", "Boutique"],
    desc: "Un troll jardinier défend son potager et son poulailler contre limaces, renards et sangliers.",
    touches: "<kbd>ZQSD</kbd> <kbd>Espace</kbd> · <kbd>Flèches</kbd> <kbd>Entrée</kbd>"
  },
  {
    repo: "evite-la-balle", titre: "Évite la balle !", emoji: "☄️", kind: "jeu", deuxJoueurs: true,
    couleur: "#ffc53d", tags: ["Coop", "2 joueurs", "Survie"],
    desc: "Balles, missiles et météores tombent par vagues : survivez ensemble et ressuscitez votre partenaire.",
    touches: "<kbd>ZQSD</kbd> · <kbd>8456</kbd> — <kbd>Entrée</kbd> mode leçon 🤫"
  },
  {
    repo: "femke", titre: "FEMKE", emoji: "🃏", kind: "jeu", deuxJoueurs: false,
    couleur: "#ff3fa4", tags: ["Cartes", "Shithead / Palace", "Règles maison"],
    desc: "Jeu de cartes de la famille du Palace : 2 qui relance, 10 qui brûle, 3 qui attaque…",
    touches: "🖱️ à la souris"
  },
  {
    repo: "angry-snails", titre: "Angry Snails", emoji: "🐌", kind: "jeu", deuxJoueurs: false,
    couleur: "#9ccc65", tags: ["Physique", "Lance-pierre", "10 niveaux"],
    desc: "Angry Birds version escargots : rasez le potager ! Un nouvel escargot et son pouvoir à chaque niveau.",
    touches: "🖱️ glisser pour tirer · clic / <kbd>Espace</kbd> = pouvoir"
  },
  {
    repo: "plans-lego", titre: "Plans LEGO", emoji: "🧱", kind: "outil", deuxJoueurs: false,
    couleur: "#ff8a3d", tags: ["Notices 3D", "three.js", "Hors ligne"],
    desc: "Notices de montage LEGO en 3D : gyroroues Sherman S & Kingsong S18, masque de Sunraku, mini-modèles.",
    touches: "🖱️ tourner, zoomer, étape par étape"
  }
];

const USER = "v20100t";
const grid = document.getElementById("grid");

grid.innerHTML = PROJETS.map((p, i) => {
  const url = `https://${USER}.github.io/${p.repo}/`;
  const code = `https://github.com/V20100T/${p.repo}`;
  return `
  <article class="card" data-kind="${p.kind}" data-2j="${p.deuxJoueurs}" style="--accent:${p.couleur}; animation-delay:${i * 70}ms">
    <a class="shot" href="${url}" tabindex="-1" aria-hidden="true">
      <span class="emoji">${p.emoji}</span>
      <img src="img/${p.repo}.jpg" alt="" loading="lazy" width="1280" height="800">
    </a>
    <div class="body">
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      <h2>${p.titre}</h2>
      <p>${p.desc}</p>
      <div class="keys">${p.touches}</div>
      <div class="actions">
        <a class="btn play" href="${url}">${p.kind === "jeu" ? "▶ Jouer" : "▶ Ouvrir"}</a>
        <a class="btn code" href="${code}" aria-label="Code source de ${p.titre}">&lt;/&gt; Code</a>
      </div>
    </div>
  </article>`;
}).join("");

// compteurs animés
function countUp(el, n) {
  let v = 0;
  const t = setInterval(() => { el.textContent = ++v; if (v >= n) clearInterval(t); }, 90);
}
countUp(document.getElementById("nb-projets"), PROJETS.length);
countUp(document.getElementById("nb-jeux"), PROJETS.filter(p => p.kind === "jeu").length);

// filtres
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    const f = chip.dataset.filter;
    grid.querySelectorAll(".card").forEach(card => {
      const show = f === "tous"
        || (f === "2j" && card.dataset["2j"] === "true")
        || card.dataset.kind === f;
      card.classList.toggle("hidden", !show);
    });
  });
});
</script>
</body>
</html>
